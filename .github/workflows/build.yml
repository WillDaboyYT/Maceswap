name: Build MaceSwap

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build mod
        run: gradle --no-daemon build

      - name: Upload installable mod
        uses: actions/upload-artifact@v4
        with:
          name: MaceSwap-1.21.11
          path: build/libs/maceswap-*.jar
          if-no-files-found: error
          retention-days: 30
